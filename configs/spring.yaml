# 策略机制复现：本地模型、统一语义观测和指定目标；并非论文原模型/分数复现。
# think=false 关闭模型私有思考；ReAct 的显式 thought 或 SPRING 节点问答仍保留。
# SPRING 每个环境动作固定查询 9 个 DAG 节点，500 步最多 4500 次模型调用。
experiment_name: spring_ollama
agent:
  name: spring
  params: {}
  prompts:
    system: prompts/spring/system.txt
    step: prompts/spring/step.txt
    questions: prompts/spring/questions.yaml
    knowledge: prompts/spring/paper_context.txt
environment:
  name: crafter
  observation: local_semantic
  params: {}
task:
  description: Collect at least one unit of diamond while staying alive.
  success_condition:
    achievement: collect_diamond
    count: 1
model:
  provider: auto  # 按 API 地址识别；可显式指定 ollama、deepseek、openai
  base_url: http://localhost:11434
  name: qwen3.8:latest  # 切换服务只需修改 base_url、name 和 api_key（如有）
  api_key: ""
  api_key_env: null  # 可填环境变量名，代替明文 api_key
  timeout: 120
  think: true
  params:
    temperature: 0
    num_predict: 32768
    num_ctx: 65536
experiment:
  seeds:
  - 0
  episodes_per_seed: 1
  max_steps: 500
  max_model_calls: 4500
output_dir: outputs/spring
